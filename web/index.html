<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>挣钱路线图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, cute and polished like a shipped habit app: soft, warm, rewarding, never cluttered
   IDEA a pocket dig-season companion: a clay-pot mascot, squares you fill like soil layers, a world map that lights up, a radio of daily finds
   PICTURE the mascot card with the rising "expected salary" curve on Today; the lit world map; per-skill square strips
   COLOUR peach-white ground, plum ink, coral lead, mint for progress, sky and butter as support; each skill gets its own pastel
   TYPE ZCOOL KuaiLe for the logo only, Nunito 800 for numbers and Latin, Noto Sans SC for Chinese
   LAYOUT one centred app column (max 720px) on every screen, sticky top bar, floating tab bar and a "说一句" button, detail in bottom sheets */
:root{color-scheme:light dark;--bg:light-dark(#fff8f3,#15131a);--card:light-dark(#ffffff,#201d27);--ink:light-dark(#2d2430,#f3eef6);--quiet:light-dark(#8a7f8e,#a79fb0);--line:light-dark(#f1e7e1,#302a39);--soft:light-dark(#fff1ea,#2a2532);--coral:light-dark(#ff7a59,#ff8f73);--coralsoft:light-dark(#ffe6dd,#45282a);--mint:light-dark(#21b892,#4fd8b6);--mintsoft:light-dark(#dcf6ee,#1d3a33);--sky:light-dark(#4da8ff,#74bcff);--butter:light-dark(#ffc94d,#ffd36e);--land:light-dark(#f3eeea,#29252f);--border:light-dark(#d9cec7,#4a4352);--sh:0 10px 28px -14px rgba(120,60,40,.28),0 1px 3px rgba(120,60,40,.07)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:clip}
a{color:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer}
.n{font-family:Nunito,"Noto Sans SC",sans-serif;font-weight:900;font-variant-numeric:tabular-nums}
.app{max-width:720px;margin:0 auto;padding:0 16px 130px}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.top .logo{display:flex;align-items:center;gap:8px;font-family:"ZCOOL KuaiLe",sans-serif;font-size:22px;flex:1}
.top .logo svg{width:34px;height:34px}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:13.5px;font-weight:700;white-space:nowrap}
.pill svg{width:16px;height:16px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--quiet)}
.sync.on{background:var(--mint)}
h1{font-size:30px;line-height:1.1;margin:14px 2px 12px;font-weight:900;letter-spacing:-.01em}
h2{font-size:18px;margin:0;font-weight:900}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h small{font-size:13px;color:var(--quiet);font-weight:500}
.link{background:none;border:0;color:var(--coral);font-weight:700;font-size:14px;padding:6px 0}
.hero{background:linear-gradient(160deg,var(--coral),light-dark(#ffa06f,#ff8a6a));color:#fff;position:relative;overflow:hidden}
.hero .mascot{display:flex;gap:12px;align-items:flex-start}
.hero .mascot svg{width:64px;height:64px;flex:none;transform-origin:50% 90%}
.hero .mascot svg.hop{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{background:rgba(255,255,255,.95);color:#3a2a2a;border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:15px;font-weight:500;line-height:1.45}
.hero .money{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px}
.hero .money .n{font-size:clamp(38px,9vw,50px);line-height:1}
.hero .money span{font-size:13px;opacity:.92}
.hero .delta{display:inline-block;margin-top:6px;background:rgba(255,255,255,.22);border-radius:10px;padding:2px 8px;font-size:13px;font-weight:700}
.spark{height:70px;margin-top:8px}
.spark svg{width:100%;height:100%;display:block}
.ask{display:flex;align-items:center;gap:10px;margin-top:14px;background:#fff;border-radius:18px;padding:6px 6px 6px 14px;cursor:text;border:0;width:100%;text-align:left;color:#9a8a8a;font-size:15px}
.ask span{flex:1}
.ask b{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--coral);color:#fff}
.ask b svg{width:20px;height:20px}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-child{border-top:0}
.qbox{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--border);background:none;display:grid;place-items:center;flex:none;padding:0}
.qbox.on{background:var(--mint);border-color:var(--mint)}
.qbox svg{width:16px;height:16px;color:#fff}
.quest .t{flex:1;font-weight:500;line-height:1.35}
.quest .t small{display:block;color:var(--quiet);font-size:12.5px;font-weight:400}
.quest.done .t{color:var(--quiet);text-decoration:line-through}
.due{font-size:13px;font-weight:800;padding:3px 9px;border-radius:10px;background:var(--soft);color:var(--quiet);white-space:nowrap;font-family:Nunito,"Noto Sans SC",sans-serif}
.due.hot{background:var(--coral);color:#fff}
.due.warm{background:var(--coralsoft);color:var(--coral)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:8px 6px;font-weight:700;font-size:14.5px;color:var(--quiet);min-height:40px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:7px 13px;font-size:14px;font-weight:600;min-height:36px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .t{flex:1;font-weight:700;line-height:1.35}
.row .t small{display:block;color:var(--quiet);font-weight:400;font-size:13px;margin-top:2px}
.badge{min-width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Nunito,sans-serif;font-weight:900;font-size:18px;flex:none}
.imp5{background:var(--coral);color:#fff}.imp4{background:var(--coralsoft);color:var(--coral)}.imp3{background:light-dark(#fff3d6,#3a3120);color:light-dark(#b07a00,#ffd36e)}.imp2,.imp1,.imp0{background:var(--soft);color:var(--quiet)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--soft);color:var(--quiet);margin-right:4px;white-space:nowrap}
.tag.new{background:var(--mint);color:#fff}
.sk{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.sk-h{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;width:100%;text-align:left}
.sk-h .t{flex:1;font-weight:800;line-height:1.3}
.sk-h .t small{display:block;font-weight:500;color:var(--quiet);font-size:12.5px}
.lv{font-family:Nunito,"Noto Sans SC",sans-serif;font-weight:900;font-size:14px;padding:3px 10px;border-radius:10px;white-space:nowrap}
.sqs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sqs.w20{grid-template-columns:repeat(10,minmax(0,1fr))}
.sqs i{aspect-ratio:1;border-radius:8px;background:var(--land);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;transition:transform .15s,background .15s}
.sqs i.f{background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.sqs i.pop{transform:scale(1.22)}
.hint{font-size:12.5px;color:var(--quiet);margin:8px 2px 0}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;width:100%;border:0;border-radius:16px;padding:12px 14px;background:var(--soft);font-weight:800;font-size:15px}
.chk.on{background:var(--mint);color:#fff}
.ring{flex:none}
.meter{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:6px;background:var(--coral);transition:width .5s}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini button{border:0;background:var(--soft);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600}
.mini button b{color:var(--coral)}
.mapwrap{border-radius:20px;overflow:hidden;background:light-dark(#fbfdff,#1b1922);margin:0 -4px}
#map{display:block;width:100%;height:auto}
#map path{stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
#map path.rg{cursor:pointer}
#map path.sel{stroke:var(--ink);stroke-width:2}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--quiet);margin-top:10px}
.ramp{flex:0 0 120px;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--land),var(--coral))}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:18px;padding:12px}
.stat span{display:block;font-size:12.5px;color:var(--quiet);font-weight:700}
.stat .n{font-size:21px}
.pos{color:var(--mint)}.neg{color:var(--coral)}
.bars{margin-top:6px}
.bars .b{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:center;margin:7px 0;font-size:12.5px;color:var(--quiet)}
.bars .b div{display:grid;gap:3px}
.bars .b i{display:block;height:9px;border-radius:5px}
.ent{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.ent .t{flex:1;font-weight:600;line-height:1.3}
.ent .t small{display:block;color:var(--quiet);font-weight:400;font-size:12.5px}
.x{border:0;background:none;color:var(--quiet);width:36px;height:36px;border-radius:12px;font-size:18px}
.empty{color:var(--quiet);font-size:14.5px;text-align:center;padding:18px 8px}
.empty svg{width:70px;height:70px;display:block;margin:0 auto 6px;opacity:.9}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:26px;box-shadow:0 14px 40px -12px rgba(80,40,30,.35);padding:6px;width:min(560px,calc(100% - 24px))}
.tabbar button{flex:1;border:0;background:none;border-radius:20px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--quiet);position:relative;min-height:52px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected=true]{color:var(--coral);background:var(--coralsoft)}
.tabbar .count{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:10.5px;line-height:17px;font-family:Nunito,sans-serif}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:21;height:54px;padding:0 20px 0 14px;border:0;border-radius:27px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.fab svg{width:24px;height:24px}
.scrim{position:fixed;inset:0;background:rgba(30,20,30,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(720px,100%);max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--border);margin:2px auto 12px}
.sheet h3{font-size:22px;margin:0 0 4px;font-weight:900;line-height:1.25}
.sheet .sub{color:var(--quiet);font-size:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:6px 10px;font-size:14.5px;margin:12px 0}
.kv dt{color:var(--quiet)}.kv dd{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14.5px;background:var(--soft);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.pri{background:var(--coral);color:#fff}
.btn.ok{background:var(--mint);color:#fff}
.fig{position:relative;height:170px;margin-top:6px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:11.5px;fill:var(--quiet);font-family:Nunito,"Noto Sans SC",sans-serif;font-weight:700}
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
textarea{min-height:92px;resize:none}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--coral)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ex button{border:0;background:var(--card);box-shadow:var(--sh);border-radius:12px;padding:6px 10px;font-size:13px}
.act{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-top:10px}
.act .h{display:flex;gap:10px;align-items:center;font-weight:800}
.act .h .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-weight:900}
.act .q{font-size:13.5px;color:var(--quiet);margin:8px 0 6px}
.alts{display:flex;flex-wrap:wrap;gap:6px}
.alts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:13.5px;font-weight:600}
.alts button[aria-pressed=true]{border-color:var(--coral);background:var(--coralsoft);color:var(--coral)}
.act.done{opacity:.55}
.thinking{display:flex;align-items:center;gap:8px;color:var(--quiet);font-size:14px;margin-top:12px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-3px)}}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-180px);z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 16px;font-weight:800;font-size:14.5px;box-shadow:var(--sh);transition:transform .3s cubic-bezier(.2,.9,.25,1);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.cf{position:fixed;z-index:70;width:9px;height:13px;border-radius:3px;pointer-events:none;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.top-in{position:relative}
.ver{position:absolute;top:1px;right:16px;font-size:9.5px;line-height:1;color:var(--quiet);letter-spacing:.02em}
.pill.bk{border:0;padding:0 10px;cursor:pointer}
.top .logo{white-space:nowrap}
@media(max-width:420px){.pill.bk .bt{display:none}.pill.bk{padding:0 9px}.top-in{gap:7px}}
.chat{margin-top:14px;display:grid;gap:8px}
.chat .bot{display:flex;gap:8px;align-items:flex-end}
.chat .bot svg{width:36px;height:36px;flex:none}
.chat .bot .bubble{background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.chat .me{justify-self:end;max-width:80%;background:var(--ink);color:var(--bg);border-radius:18px 18px 6px 18px;padding:8px 13px;font-size:15px;font-weight:600;line-height:1.4}
.chat .alts{margin-left:44px}
.chat .alts button small{color:var(--quiet);font-weight:400;margin-left:4px}
.chat .alts button.rec{border-color:var(--mint);background:var(--mintsoft)}
.ovr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px;margin:10px 0}
.ovr b{font-weight:800}.ovr span{color:var(--quiet)}
.btn.warn{background:var(--coral);color:#fff}
.foot{font-size:12.5px;color:var(--quiet);text-align:center;margin:18px 8px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
